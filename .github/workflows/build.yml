name: Build DEEN
on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true
      - name: Generate platform folders
        run: flutter create --platforms=android --org com.deen --project-name deen . && rm -f test/widget_test.dart
      - name: Patch Android config
        run: python3 ../scripts/patch_android.py
      - run: flutter pub get
      - run: flutter analyze
        continue-on-error: true
      - run: flutter test
        continue-on-error: true
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: deen-android
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
