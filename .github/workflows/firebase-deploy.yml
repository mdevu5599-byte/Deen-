name: Deploy DEEN Firebase
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'admin/**'
      - 'mobile/**'
      - '.github/workflows/firebase-deploy.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_ADMIN_HOSTING_SITE_ID: ${{ secrets.FIREBASE_ADMIN_HOSTING_SITE_ID }}
      FIREBASE_WEB_HOSTING_SITE_ID: ${{ secrets.FIREBASE_WEB_HOSTING_SITE_ID }}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
      FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Install Cloud Functions dependencies
        working-directory: backend/functions
        run: npm ci

      - name: Build Cloud Functions
        working-directory: backend/functions
        run: npm run build

      - name: Build Admin Dashboard
        working-directory: admin
        run: |
          npm ci
          npm run build

      - name: Build public web app
        working-directory: mobile
        run: |
          flutter pub get
          flutter build web --release \
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" \
            --dart-define=FIREBASE_AUTH_DOMAIN="$FIREBASE_AUTH_DOMAIN" \
            --dart-define=FIREBASE_PROJECT_ID="$NEXT_PUBLIC_FIREBASE_PROJECT_ID" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=FIREBASE_APP_ID="$NEXT_PUBLIC_FIREBASE_APP_ID"

      - name: Check required Firebase settings
        run: |
          test -n "$FIREBASE_PROJECT_ID" || { echo 'Missing FIREBASE_PROJECT_ID'; exit 1; }
          test -n "$FIREBASE_SERVICE_ACCOUNT" || { echo 'Missing FIREBASE_SERVICE_ACCOUNT'; exit 1; }
          test -n "$FIREBASE_ADMIN_HOSTING_SITE_ID" || { echo 'Missing FIREBASE_ADMIN_HOSTING_SITE_ID'; exit 1; }
          test -n "$FIREBASE_WEB_HOSTING_SITE_ID" || { echo 'Missing FIREBASE_WEB_HOSTING_SITE_ID'; exit 1; }

      - name: Authenticate with Firebase service account
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Configure Firebase Hosting targets
        working-directory: backend
        run: |
          firebase target:apply hosting admin "$FIREBASE_ADMIN_HOSTING_SITE_ID" --project "$FIREBASE_PROJECT_ID"
          firebase target:apply hosting web "$FIREBASE_WEB_HOSTING_SITE_ID" --project "$FIREBASE_PROJECT_ID"

      - name: Deploy Firebase resources and hosting
        working-directory: backend
        run: |
          firebase deploy --project "$FIREBASE_PROJECT_ID" \
            --only firestore:rules,firestore:indexes,storage,functions,hosting:admin,hosting:web \
            --non-interactive
